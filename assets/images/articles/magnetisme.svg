<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Le magnétisme</title>
  <desc id="desc">Un aimant en fer à cheval aux pôles nord et sud, entouré de lignes de champ magnétique lumineuses et d’une boussole.</desc>
