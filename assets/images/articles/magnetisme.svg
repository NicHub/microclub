    <radialGradient id="halo"><stop stop-color="#2dd4bf" stop-opacity=".38"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e8f0"/><stop offset=".22" stop-color="#64748b"/><stop offset=".5" stop-color="#f8fafc"/><stop offset=".78" stop-color="#475569"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f87171"/><stop offset=".5" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
