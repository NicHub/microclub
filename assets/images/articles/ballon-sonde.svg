<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ballon-sonde et radiosonde</title>
  <desc id="desc">Un ballon-sonde emporte une radiosonde au-dessus d’un paysage, avec des ondes radio vers une antenne au sol.</desc>
