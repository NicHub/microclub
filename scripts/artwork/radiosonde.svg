    <path d="M143 87 L163 90 L162 106 L142 103Z" fill="#111b20"/>
    <g fill="url(#gold)">
      <circle cx="146" cy="91" r="1.3"/><circle cx="152" cy="92" r="1.3"/><circle cx="158" cy="93" r="1.3"/>
      <circle cx="146" cy="98" r="1.3"/><circle cx="152" cy="99" r="1.3"/><circle cx="158" cy="100" r="1.3"/>
    </g>
    <circle cx="160" cy="228" r="13" fill="url(#led)"/>
    <circle cx="160" cy="228" r="1.7" fill="#c9f1df"/>
