<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1600" viewBox="0 0 1000 1600">
  <title>Radiosonde dans la stratosphère — illustration originale Microclub</title>
  <desc>Ballon nacré, suspente, capteur météorologique, carte embarquée et antenne radio, éclairés par les étoiles.</desc>
  <defs>
    <radialGradient id="balloon" cx="30%" cy="24%" r="76%">
      <stop stop-color="#aab2b7"/>
      <stop offset=".18" stop-color="#7f8b94"/>
      <stop offset=".48" stop-color="#465461"/>
      <stop offset=".76" stop-color="#1b2631"/>
      <stop offset=".94" stop-color="#0a1018"/>
      <stop offset="1" stop-color="#273747"/>
    </radialGradient>
    <radialGradient id="balloonLight" cx="27%" cy="19%" r="66%">
      <stop stop-color="#dbe1df" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#dbe1df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#536774"/>
      <stop offset=".55" stop-color="#273848"/>
      <stop offset="1" stop-color="#667a87"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#748990"/>
      <stop offset=".12" stop-color="#c1c8bc"/>
      <stop offset=".18" stop-color="#697d7f"/>
      <stop offset=".42" stop-color="#30434d"/>
      <stop offset="1" stop-color="#0c161f"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#52616a"/>
      <stop offset=".32" stop-color="#293a45"/>
      <stop offset="1" stop-color="#111b24"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1d2b36"/>
      <stop offset="1" stop-color="#060c13"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#27483f"/>
      <stop offset=".5" stop-color="#112f2a"/>
      <stop offset="1" stop-color="#091d1d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e2930"/>
      <stop offset=".25" stop-color="#0d161b"/>
      <stop offset="1" stop-color="#02070c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ab9f73"/>
      <stop offset=".4" stop-color="#605b3f"/>
      <stop offset="1" stop-color="#302f23"/>
    </linearGradient>
    <radialGradient id="led">
      <stop stop-color="#d7fff4"/>
      <stop offset=".16" stop-color="#88dbc8"/>
      <stop offset=".4" stop-color="#48aaab" stop-opacity=".45"/>
      <stop offset="1" stop-color="#48aaab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The shading and grazing rim light create volume without an outline. -->
  <path d="M570 91 C691 91 782 186 778 309 C775 420 699 486 611 523 L597 553 L579 562 L560 551 L549 523 C443 490 359 421 356 310 C352 184 446 91 570 91Z" fill="url(#balloon)"/>
  <path d="M570 91 C691 91 782 186 778 309 C775 420 699 486 611 523 L597 553 L579 562 L560 551 L549 523 C443 490 359 421 356 310 C352 184 446 91 570 91Z" fill="url(#balloonLight)"/>
  <path d="M390 200 C422 121 520 78 602 96" fill="none" stroke="#b8c3c8" stroke-opacity=".45" stroke-width="1.4"/>
  <path d="M739 402 C711 455 667 493 611 523" fill="none" stroke="#516a7b" stroke-opacity=".55" stroke-width="1.1"/>
  <path d="M466 139 C409 275 455 435 549 523 M540 104 C493 285 505 435 568 539 M616 108 C638 298 623 450 586 545 M704 158 C737 305 674 443 603 531" fill="none" stroke="#99a8ae" stroke-opacity=".045" stroke-width="3"/>
  <path d="M561 549 L598 551 L594 560 L568 559Z" fill="#53616a"/>
  <path d="M570 561 Q572 590 556 618" fill="none" stroke="url(#cord)" stroke-width="2.1"/>
  <path d="M548 607 L567 609 L574 644 L555 650 L544 639Z" fill="#6a433a"/>
  <path d="M549 609 L554 644 M560 611 L565 645" stroke="#a67f65" stroke-opacity=".45" stroke-width="2"/>
  <path id="suspension" d="M558 650 C539 752 570 873 532 1017" fill="none" stroke="url(#cord)" stroke-width="1.7"/>

