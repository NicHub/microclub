      <path d="M127 138 L135 139 L135 143 L127 142Z M127 146 L135 147 L135 151 L127 150Z M127 154 L135 155 L135 159 L127 158Z M127 162 L135 163 L135 167 L127 166Z M127 170 L135 171 L135 175 L127 174Z"/>
