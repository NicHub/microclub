locale: fr-CH
timeZone: Europe/Zurich
defaultContentLanguage: fr
disableLanguages:
  - en
title: MICRoCLUB
theme: blowfish
publishDir: .hugo_nokdrive/public
resourceDir: .hugo_nokdrive/resources
enableRobotsTXT: true
enableGitInfo: true

languages:
  fr:
    label: Français
    weight: 1
    title: MICRoCLUB
    params:
      displayName: Français
      isoCode: fr-CH
      logo: images/microclub-logo-led.svg
      author:
        name: Microclub
        image: images/microclub-avatar.png
        headline: passionnés d’électronique et de microinformatique
        bio: Le premier club informatique de Suisse romande, fondé en 1976.
        links:
          - email: mailto:info@microclub.ch
          - facebook: https://www.facebook.com/groups/microclub.ch/

pagination:
  pagerSize: 12

permalinks:
  articles: /:year/:month/:day/:slug/

taxonomies:
  category: categories
  tag: tags
  author: authors

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: Le plus ancien club informatique de Suisse romande. Échanges, électronique, programmation et culture numérique.
  founded: 1976
  repository: ""
  productionBaseURL: https://microclub.ch
  images:
    - /images/microclub-social-preview-v2.jpg
  defaultSocialImage: images/microclub-social-preview-v2.jpg
  socialImageAlt: MICRoCLUB — électronique, programmation et culture numérique
  colorScheme: burufugu
  defaultAppearance: dark
  autoSwitchAppearance: false
  enableSearch: true
  enableCodeCopy: true
  mainSections:
    - articles
  defaultBackgroundImage: images/site-background.webp
  defaultFeaturedImage: /img/featured.svg
  backgroundCanvas: true

  header:
    layout: floating

  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: false
    showScrollToTop: true

  homepage:
    layout: landing
    homepageImage: images/site-background.webp
    homepageImageMobile: images/site-background.webp
    layoutBackgroundBlur: true
    showRecent: true
    showRecentItems: 12
    recentMaxMonths: 6
    showMoreLink: true
    showMoreLinkDest: articles
    cardView: true

  article:
    showDate: true
    showAuthor: true
    showBreadcrumbs: true
    showHeadingAnchors: true
    showPagination: true
    showReadingTime: true
    showTableOfContents: true
    showTaxonomies: true

  list:
    showSummary: true
    showCards: true
    groupByYear: false
    cardView: true

menus:
  main:
    - name: Articles
      url: /articles/
      weight: 20
    - name: Catégories
      url: /categories/
      weight: 30
    - name: Agenda
      url: /agenda/
      weight: 10
    - name: Présentation
      url: /presentation/
      weight: 5
    - name: Ressources
      url: /liens/
      weight: 40
    - name: RSS
      url: /rss/
      weight: 45
    - name: Contact
      url: /contacts/
      weight: 50

privacy:
  youtube:
    privacyEnhanced: true

module:
  mounts:
    - source: assets
      target: assets
    - source: content/articles/2026/09/19/images
      target: assets/images
