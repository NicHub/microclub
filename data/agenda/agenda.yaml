###
# Données de l’agenda du MicroClub.
# Formats attendus :
#   date        : date et heure au format ISO 8601, heure locale suisse sans
#                 décalage (le fuseau Europe/Zurich est défini dans
#                 config/_default/hugo.yaml, qui gère l’heure d’été/hiver),
#                 ex. "2026-11-13T19:00:00". Non tenue à 19:00.
#   status      : une des trois valeurs :
#                   - "confirmed"     : confirmée, pas encore déroulée ;
#                   - "tobeconfirmed" : à confirmer (date provisoire) ;
#                   - "canceled"      : annulée ou déplacée (affichée barrée).
#                 "done" n’existe plus : un évènement confirmé ou à confirmer
#                 dont la date est passée est affiché automatiquement comme
#                 "done" (a eu lieu).
#   title       : titre de la conférence (markdown accepté).
#   speaker     : intervenant, facultatif.
#   location    : lieu, objet {name, url} (url facultative, facultatif).
#   description : brève description ou consignes pour les participants.
#   links       : liste de URLs (documents, articles associés), facultative.
#   notes       : liste de brèves (markdown), affichées en puces.
#
# La clé "date" sert de clé de tri (ordre inverse chronologique) : la garder
# au format ci-dessus et descendre pour les événements passés.
##

