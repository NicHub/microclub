baseURL = "https://microclub.ch/"
locale = "fr-CH"
timeZone = "Europe/Zurich"
defaultContentLanguage = "fr"
disableLanguages = ["en"]
title = "Microclub"
theme = "blowfish"
publishDir = ".hugo_nokdrive/public"
resourceDir = ".hugo_nokdrive/resources"
enableRobotsTXT = true
enableGitInfo = true

[languages.fr]
  label = "Français"
  weight = 1
  title = "Microclub"

  [languages.fr.params]
    displayName = "Français"
    isoCode = "fr-CH"
    logo = "images/microclub-logo-led.svg"

    [languages.fr.params.author]
      name = "Microclub"
      image = "images/microclub-avatar.png"
      headline = "passionnés d’électronique et de microinformatique"
      bio = "Le premier club informatique de Suisse romande, fondé en 1976."
      links = [
        { email = "mailto:info@microclub.ch" },
        { facebook = "https://www.facebook.com/groups/microclub.ch/" },
      ]

[pagination]
  pagerSize = 12

[permalinks]
  articles = "/:year/:month/:day/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Le plus ancien club informatique de Suisse romande. Échanges, électronique, programmation et culture numérique."
  founded = 1976
  repository = ""
  productionBaseURL = "https://microclub.ch"
  images = ["/images/microclub-avatar.png"]
  defaultSocialImage = "images/microclub-avatar.png"
  socialImageAlt = "Logo du Microclub"
  colorScheme = "burufugu"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  mainSections = ["articles"]
  defaultBackgroundImage = "images/site-background.png"
  defaultFeaturedImage = "/img/featured.svg"
  backgroundCanvas = true

  [params.header]
    layout = "floating"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "landing"
    homepageImage = "images/blowfish-welcome.png"
    layoutBackgroundBlur = true
    showRecent = true
    showRecentItems = 12
    recentMaxMonths = 6
    showMoreLink = true
    showMoreLinkDest = "articles"
    cardView = true

  [params.article]
    showDate = true
    showAuthor = true
    showBreadcrumbs = true
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true

  [params.list]
    showSummary = true
    showCards = true
    groupByYear = false
    cardView = true

[[menus.main]]
  name = "Articles"
  url = "/articles/"
  weight = 20
[[menus.main]]
  name = "Catégories"
  url = "/categories/"
  weight = 30
[[menus.main]]
  name = "Agenda"
  url = "/agenda/"
  weight = 10
[[menus.main]]
  name = "Présentation"
  url = "/presentation/"
  weight = 5
[[menus.main]]
  name = "Ressources"
  url = "/liens/"
  weight = 40
[[menus.main]]
  name = "Contact"
  url = "/contacts/"
  weight = 50
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
