baseURL = "https://microclub.ch/"
locale = "fr-CH"
timeZone = "Europe/Zurich"
defaultContentLanguage = "fr"
disableLanguages = ["en"]
title = "Microclub"
theme = "blowfish"
publishDir = ".hugo_nokdrive/public"
resourceDir = ".hugo_nokdrive/resources"
enableRobotsTXT = true
enableGitInfo = true

[languages.fr]
  label = "Français"
  weight = 1
  title = "Microclub"

  [languages.fr.params]
    displayName = "Français"
    isoCode = "fr-CH"

    [languages.fr.params.author]
      name = "Microclub"
      headline = "Association de passionnés d’électronique et de micro-informatique."

[pagination]
  pagerSize = 12

[permalinks]
  articles = "/:year/:month/:day/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Le plus ancien club informatique de Suisse romande. Échanges, électronique, programmation et culture numérique."
  founded = 1976
  repository = ""
  colorScheme = "noir"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  mainSections = ["articles"]

  [params.header]
    layout = "floating"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "landing"
    showRecent = true
    showRecentItems = 12
    showMoreLink = true
    showMoreLinkDest = "articles"
    cardView = true

  [params.article]
    showDate = true
    showAuthor = true
    showBreadcrumbs = true
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true

  [params.list]
    showSummary = true
    showCards = true
    groupByYear = false
    cardView = true

[[menus.main]]
  name = "Articles"
  url = "/articles/"
  weight = 10
[[menus.main]]
  name = "Agenda"
  url = "/agenda/"
  weight = 20
[[menus.main]]
  name = "Le club"
  url = "/historique/"
  weight = 30
[[menus.main]]
  name = "Ressources"
  url = "/liens/"
  weight = 40
[[menus.main]]
  name = "Contact"
  url = "/contacts/"
  weight = 50
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
