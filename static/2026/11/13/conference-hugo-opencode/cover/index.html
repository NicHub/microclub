<!doctype html>
<html lang="fr-CH">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Microclub — Hugo &amp; OpenCode</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f8f9fc;
        background: #030508;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { min-height: 100vh; }

      .conference-visual {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: start center;
        overflow: hidden;
        /*
        background: #000 url("../images/featured.jpg") center / cover no-repeat;
        */
        background: #000 url("./assets/site-background.webp") center / cover no-repeat;
      }

      .conference-visual::after {
        display: none;
      }

      .content {
        position: fixed;
        inset: 0;
        z-index: 1;
        text-align: center;
        pointer-events: none;
      }

      .location,
      h1,
      .logos,
      .event-details {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        margin: 0;
      }

      .location {
        top: 18.5%;
        color: #67b2ff;
        font-size: clamp(1rem, 2.2vw, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.25em;
      }

      h1 {
        top: 26%;
        color: #fff;
        font-size: clamp(3.5rem, 12vw, 9rem);
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 0.95;
      }

      .logos {
        top: 42%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5vh;
      }

      .logos img {
        display: block;
        width: min(43.2vw, 54.8rem);
        max-height: 8rem;
        object-fit: contain;
      }

      .logos img:first-child {
        width: min(43.2vw, 44.8rem);
        max-height: none;
      }

      .logos img:nth-child(2) { max-height: none; }

      .event-details {
        bottom: 7%;
        color: rgb(255 255 255 / 82%);
        font-size: clamp(1rem, 2vw, 1.75rem);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @media (max-width: 36rem) {
        .conference-visual { background-position: 84% center; }
        .content { padding-top: 3rem; }
      }
    </style>
  </head>
  <body>
    <main class="conference-visual">
      <div class="content">
        <p class="location">EPFL • LAUSANNE</p>
        <h1>MICRoCLUB</h1>
        <div class="logos" aria-label="Outils utilisés pour le site">
          <img src="assets/hugo-logo-wide.svg" alt="Logo de Hugo">
          <img src="assets/opencode-wordmark-dark.svg" alt="Logo d’OpenCode">
        </div>
        <p class="event-details">Nicolas Jeanmonod • Microclub • EPFL • 13&nbsp;novembre&nbsp;2026</p>
      </div>
    </main>
  </body>
</html>
